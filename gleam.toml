name = "chippy"
version = "0.1.0"
target = "erlang"

description = "An intentionally simple, server-rendered Markdown website system"
licences = ["MIT"]
repository = { type = "github", user = "bmehder", repo = "chippy" }

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
mist = ">= 6.0.3 and < 7.0.0"
mork = ">= 1.12.1 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
